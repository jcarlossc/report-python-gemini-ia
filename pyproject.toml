[project]
name = "report-python-gemini-ia"
version = "0.5.1"
description = ""
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "types-pyyaml (>=6.0.12.20261103,<7.0.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)"
]

[tool.poetry]
packages = [{include = "report_python_gemini_ia", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
sales = "report_python_gemini_ia.main:main"

[dependency-groups]
dev = [
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
app = "poetry run sales"
pytest = "poetry run pytest ."
covreport = "poetry run pytest --cov=report_python_gemini_ia --cov-report=html"
covconsole = "poetry run pytest --cov=report_python_gemini_ia --cov-report=term-missing"
format = "poetry run ruff format ."
lint = "poetry run ruff check ."
mypy = "poetry run mypy ."
check = "poetry run ruff format --check ."
precommit = "poetry run pre-commit run --all-files"
fix = "poetry run ruff check . --fix"
